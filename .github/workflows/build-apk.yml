name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::$(grep -E -A3 'What went wrong|^e: |FAILURE|error:' build.log | tr '\n' ' ' | cut -c1-1500)"
            tail -60 build.log
            exit $code
          fi
          cat build.log | tail -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OverlayClicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
